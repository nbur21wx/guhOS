<!DOCTYPE html>
<html>
    <head>
        <link href="./src/styles/tailwind.css" rel="stylesheet" />
        <script type="module" src="/src/js/time.js"></script>
        <script type="module" src="/src/js/windows.js"></script>
        <script type="module" src="/src/js/notes.js"></script>
    </head>
    <body class="bg-[url(/src/img/bg.jpg)] bg-cover h-screen overflow-hidden">
        <div id="top" class="flex justify-between backdrop-blur-md bg-black/10 p-2 *:bg-amber-200 *:font-mono">
            <p id="welcomeopen" class="pl-2.5 pr-2.5 pt-1 pb-1 rounded-full cursor-pointer">guhOS</p>
            <div class="flex *:pl-2 *:pr-2 pl-2 pr-2 pt-1 pb-1 rounded-full">
                <p class="bg-amber-600 rounded-full">1</p>
                <p class="">2</p>
                <p class="">3</p>
            </div>
            <p id="timeElement" class="pl-2.5 pr-2.5 pt-1 pb-1 rounded-full">TIME</p>
        </div>
        <div id="desktopApps" class="*:outline-amber-800/1 *:hover:bg-amber-300/50 *:transition-all duration-150 ease-in-out *:focus:outline-2 *:focus:outline-amber-800 *:active:scale-95 *:rounded-md grid grid-cols-[repeat(auto-fit,minmax(0px,120px))] gap-0 *:cursor-pointer *:active:cursor-default">
            <button id="notesopen" class="w-fit p-2 m-5">
                <img src="/src/img/notepad.png" class="w-22"/>
                <p class="text-center">Notes</p>
            </button>
        </div>

        <div id="welcome" class="absolute border-solid w-xl rounded-xl pb-3 border-4 bg-amber-200 dark:bg-amber-950 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 overflow-clip shadow-2xl animate-window-open">
            <div id="welcomeheader" class="flex justify-between min-w-fit h-fit bg-amber-300 mb-2 cursor-grab active:cursor-grabbing">
                <div class="w-4 h-4 ml-5"></div>
                <p class="">Welcome!</p>
                <div id="welcomeclose" class="w-4 h-4 cursor-pointer bg-red-500 rounded-full border mt-1 mr-1"></div>
            </div>
            <div class="relative grid grid-cols-[1fr_2.5rem_auto_2.5rem_1fr] grid-rows-[1fr_1px_auto_1px_1fr] bg-amber-200 [--pattern-fg:var(--color-gray-950)]/5 dark:bg-amber-950 dark:[--pattern-fg:var(--color-white)]/10">
                <div class="col-start-3 row-start-3 flex max-w-lg flex-col">
                    <div class="rounded-xl bg-amber-300 p-5 text-center text-amber-900 dark:bg-amber-900 dark:text-amber-300">
                        <h1 class="text-3xl">Welcome to guhOS!</h1>
                        <div class="mt-2 mb-2 h-0.5 max-w-xl min-w-20 rounded-full bg-linear-to-r from-amber-950/5 via-amber-950 to-amber-950/5 dark:from-amber-200/5 dark:via-amber-200 dark:to-amber-200/5"></div>
                        <h2 class="text-2xl">guhOS?? what in tarnation is that????</h2>
                        <p>a thing</p>
                    </div>
                </div>
            </div>
        </div>
        <div id="notes" class="absolute border-solid w-xl rounded-xl border-4 bg-amber-200 dark:bg-amber-950 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 overflow-clip hidden shadow-2xl animate-window-open">
            <div id="notesheader" class="flex justify-between min-w-fit h-fit bg-amber-300 cursor-grab active:cursor-grabbing">
                <div class="w-4 h-4 ml-5"></div>
                <p>Notes</p>
                <div id="notesclose" class="w-4 h-4 cursor-pointer bg-red-500 rounded-full border mt-1 mr-1"></div>
            </div>
            <div class="w-full h-64 flex">
                <div id="sidebar" class="bg-amber-900 w-73 mr-4 p-4 *:hover:bg-amber-800 *:active:bg-amber-950 *:rounded-md"></div>
                <div id="notesContent" class="block w-full h-64 p-3 bg-amber-950 text-amber-300 resize-none outline-none overflow-auto">
                    <div class="w-full h-full relative grid grid-cols-[1fr_2.5rem_auto_2.5rem_1fr] grid-rows-[1fr_1px_auto_1px_1fr]">
                        <div class="col-start-3 row-start-3 flex max-w-lg flex-col text-center">
                            <h1 class="text-amber-300/50 text-xl font-bold">No note selected!</h1>
                            <p class="text-amber-300/50">Select one from the sidebar!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
